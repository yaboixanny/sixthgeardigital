<text x="294" y="308" fill="#29394c" font-family="Arial,sans-serif" font-size="11" font-weight="700">Specifications, all in one place.</text><rect x="294" y="322" width="319" height="106" rx="4" fill="#fafbfc" stroke="#e3e6eb"/><path d="M294 348h319M294 374h319M294 400h319M424 322v106" stroke="#e3e6eb"/><g fill="#677386" font-family="Arial,sans-serif" font-size="8"><text x="305" y="338">MATERIALS</text><text x="436" y="338">Steel · Aluminum · Stainless</text><text x="305" y="365">TOLERANCES</text><text x="436" y="365">Listed for each application</text><text x="305" y="391">DRAWINGS &amp; CAD</text><text x="436" y="391">Organized by product</text><text x="305" y="417">CUSTOM WORK</text><text x="436" y="417">Share your project details</text></g><g fill="#e1e6ec"><rect x="294" y="450" width="114" height="5" rx="2"/><rect x="294" y="465" width="174" height="3" rx="1"/><rect x="294" y="475" width="160" height="3" rx="1"/></g><rect x="294" y="495" width="88" height="20" rx="3" fill="#fff2e9"/><text x="304" y="508" fill="#c4490b" font-family="Arial,sans-serif" font-size="7" font-weight="700">PRODUCT LIBRARY</text></g>
<!-- Quote flow overlay -->
<g filter="url(#shadow)"><rect x="370" y="447" width="272" height="160" rx="10" fill="#fff" stroke="#e4e7eb"/><rect x="370" y="447" width="272" height="5" rx="2" fill="#ea580c"/><text x="387" y="476" fill="#17273b" font-family="Arial,sans-serif" font-size="12" font-weight="700">Start a quote request</text><g fill="#f6f7f9" stroke="#e3e6eb"><rect x="387" y="488" width="114" height="25" rx="3"/><rect x="511" y="488" width="114" height="25" rx="3"/><rect x="387" y="521" width="238" height="31" rx="3"/></g><g fill="#8994a2" font-family="Arial,sans-serif" font-size="7"><text x="395" y="504">Product or service</text><text x="519" y="504">Quantity needed</text><text x="395" y="538">Project details and required date</text></g><rect x="387" y="566" width="102" height="23" rx="3" fill="#ea580c"/><text x="399" y="581" fill="#fff" font-family="Arial,sans-serif" font-size="7" font-weight="700">REQUEST A QUOTE</text></g>
