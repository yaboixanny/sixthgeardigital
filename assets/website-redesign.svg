<!-- New industrial product website -->
<g filter="url(#shadow)"><rect x="276" y="48" width="355" height="498" rx="9" fill="white"/><path d="M285 48h337a9 9 0 0 1 9 9v18H276V57a9 9 0 0 1 9-9" fill="#e3e5e8"/><g fill="#fff"><circle cx="289" cy="62" r="3"/><circle cx="300" cy="62" r="3"/><circle cx="311" cy="62" r="3"/></g><rect x="357" y="57" width="173" height="10" rx="4" fill="#f5f6f7"/><rect x="276" y="75" width="355" height="33" fill="#fff"/><text x="293" y="96" fill="#15263c" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1">FORGE / INDUSTRIAL</text><g fill="#9ca6b3"><rect x="469" y="91" width="25" height="3" rx="1"/><rect x="504" y="91" width="25" height="3" rx="1"/><rect x="539" y="91" width="25" height="3" rx="1"/></g><rect x="581" y="86" width="34" height="13" rx="2" fill="#ea580c"/>
