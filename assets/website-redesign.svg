<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" fill="none">
<title>From a basic website to a connected industrial website</title><desc>A wireframe becomes a clear industrial product website with technical specifications, quote capture and connections to sales and business software.</desc>
